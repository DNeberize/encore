name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Test page script
        run: node tests/encore.test.js

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          if ! xcodebuild \
            -project Encore.xcodeproj \
            -scheme Encore \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1; then
            # Compiler errors as annotations: readable on the run page (and its API) without the log.
            grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            tail -60 build.log
            exit 1
          fi
          grep -E "warning: .*Encore|BUILD" build.log || true
          # An unfinished build leaves an app folder without Info.plist; never package that.
          test -f build/Build/Products/Release-iphoneos/Encore.app/Info.plist

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Encore.app Payload/
          zip -qry Encore.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Encore-ipa
          path: Encore.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
